<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-label="Troubleshooting timeline from EKS node failures through IAM AccessDenied to public load balancer success">
 <defs><linearGradient id="bg" x2="1"><stop stop-color="#0d1830"/><stop offset="1" stop-color="#172d4a"/></linearGradient></defs>
 <rect width="1400" height="320" rx="22" fill="url(#bg)"/>
 <text x="54" y="54" fill="#fff" font-family="Segoe UI,Arial" font-size="28" font-weight="800">FAILURE → DIAGNOSIS → RECOVERY</text>
 <text x="55" y="82" fill="#a9bfda" font-family="Segoe UI,Arial" font-size="16">A learning timeline, not a fabricated count of every CloudWatch event</text>
 <path d="M120 154H1277" stroke="#415977" stroke-width="6" stroke-linecap="round"/>
 <g font-family="Segoe UI,Arial" text-anchor="middle">
  <circle cx="141" cy="154" r="18" fill="#e56478" stroke="#ffc0bd" stroke-width="4"/><text x="141" y="160" font-size="18" fill="#fff" font-weight="800">1</text>
  <circle cx="397" cy="154" r="18" fill="#e58b59" stroke="#ffdb9d" stroke-width="4"/><text x="397" y="160" font-size="18" fill="#fff" font-weight="800">2</text>
  <circle cx="653" cy="154" r="18" fill="#ecc15f" stroke="#ffe8a3" stroke-width="4"/><text x="653" y="160" font-size="18" fill="#fff" font-weight="800">3</text>
  <circle cx="909" cy="154" r="18" fill="#55afce" stroke="#c1f0ff" stroke-width="4"/><text x="909" y="160" font-size="18" fill="#fff" font-weight="800">4</text>
  <circle cx="1165" cy="154" r="18" fill="#2ecb97" stroke="#beffe5" stroke-width="4"/><text x="1165" y="160" font-size="18" fill="#fff" font-weight="800">5</text>
  <g font-size="20" font-weight="700" fill="#fff"><text x="141" y="215">Node setup</text><text x="397" y="215">STS 403</text><text x="653" y="215">Internal NLB</text><text x="909" y="215">Public VPC</text><text x="1165" y="215">200 OK</text></g>
  <g font-size="15" fill="#b8cbe0"><text x="141" y="242">NodeCreationFailure</text><text x="397" y="242">TagSession denied</text><text x="653" y="242">DNS ≠ public access</text><text x="909" y="242">Subnets / IGW / tags</text><text x="1165" y="242">Browser reached Flask</text></g>
 </g>
 <text x="1350" y="297" fill="#7fa2bf" text-anchor="end" font-family="Segoe UI,Arial" font-size="14">Source: project screenshots + Kubernetes event log</text>
</svg>
