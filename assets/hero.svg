<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" role="img" aria-label="From green pipeline to live application: AWS CI/CD EKS portfolio">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071326"/><stop offset=".55" stop-color="#102847"/><stop offset="1" stop-color="#101b38"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#4ce8c0"/><stop offset="1" stop-color="#52a9ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="35"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8fb3f5" opacity=".09"/></pattern>
  </defs>
  <rect width="1400" height="450" rx="26" fill="url(#bg)"/>
  <circle cx="1240" cy="150" r="185" fill="#197be0" opacity=".25" filter="url(#glow)"/>
  <circle cx="280" cy="400" r="180" fill="#19c59f" opacity=".15" filter="url(#glow)"/>
  <rect width="1400" height="450" rx="26" fill="url(#grid)"/>
  <rect x="66" y="55" width="322" height="37" rx="18" fill="#132f45" stroke="#28bdad"/>
  <circle cx="88" cy="73" r="5" fill="#46f6bd"/>
  <text x="105" y="79" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="15" letter-spacing="2" fill="#a5fff2">FIELD ENGINEERING CASE STUDY</text>
  <text x="67" y="154" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="54" fill="#ffffff">The pipeline was green.</text>
  <text x="67" y="220" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="54" fill="url(#accent)">The browser wasn't.</text>
  <text x="69" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#b1c8e3">AWS CodePipeline · Docker · ECR · Kubernetes · EKS · VPC · NLB</text>
  <text x="70" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c3d5ee">A documented journey from IAM 403 and an internal NLB to a public HTTP endpoint.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="69" y="350" width="174" height="48" rx="12" fill="#173d38" stroke="#2bdfaa"/><text x="156" y="381" fill="#92ffe1">✓ SOURCE</text>
    <rect x="255" y="350" width="174" height="48" rx="12" fill="#173d38" stroke="#2bdfaa"/><text x="342" y="381" fill="#92ffe1">✓ BUILD</text>
    <rect x="441" y="350" width="174" height="48" rx="12" fill="#173d38" stroke="#2bdfaa"/><text x="528" y="381" fill="#92ffe1">✓ DEPLOY</text>
    <rect x="628" y="350" width="212" height="48" rx="12" fill="#14406e" stroke="#4eb2ff"/><text x="734" y="381" fill="#b9e4ff">✓ PUBLIC HTTP</text>
  </g>
  <g transform="translate(1000 84)">
    <rect width="323" height="230" rx="20" fill="#09182a" stroke="#395e87" stroke-width="2"/>
    <rect width="323" height="44" rx="20" fill="#183a5f"/>
    <rect y="23" width="323" height="21" fill="#183a5f"/>
    <circle cx="24" cy="22" r="6" fill="#fb706a"/><circle cx="44" cy="22" r="6" fill="#f8ce69"/><circle cx="64" cy="22" r="6" fill="#5defaf"/>
    <text x="162" y="28" font-family="monospace" text-anchor="middle" font-size="13" fill="#c8dff9">HTTP / TCP 80</text>
    <rect x="25" y="66" width="273" height="51" rx="10" fill="#143d35" stroke="#33d8a5"/>
    <text x="162" y="98" font-family="monospace" text-anchor="middle" font-size="18" fill="#a2ffde">200 OK</text>
    <text x="162" y="156" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Welcome to the AL=Nafi!</text>
    <text x="162" y="190" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="14" fill="#9fc0e2">Verified in Chrome</text>
  </g>
  <text x="1317" y="418" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#91abc9">HAFIZ MOHAMMAD SUNASARA · 2026</text>
</svg>
